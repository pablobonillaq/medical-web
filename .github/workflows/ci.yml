name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    name: Types, lint, format, tests and build
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # SonarQube needs the full history to know which code is new
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check .

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  e2e:
    name: End-to-end and accessibility tests
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Playwright builds the app and starts it on port 3001 (webServer in playwright.config.ts)
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Lighthouse runs without the Express API: the fake one answers /health on port 3000, so
      # the page loads with no errors in the console. It keeps running for the next step
      - name: Start the fake API
        run: node scripts/fake-api.mjs &

      # Starts the build on port 3001, runs Lighthouse 3 times per page and checks the minimum
      # scores in lighthouserc.json. The reports go to temporary public storage (about 7 days):
      # the links are printed in this step's log
      - name: Lighthouse CI
        run: npm run lighthouse -- --upload.target=temporary-public-storage

# Keys shown by SonarQube Cloud when you created the project
sonar.organization=pablobonillaq
sonar.projectKey=pablobonillaq_medical-web
sonar.projectName=Medical Web

# Application code (tests are not part of it)
sonar.sources=src
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx

# Test code
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

# Coverage report generated by Vitest (npm run test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info